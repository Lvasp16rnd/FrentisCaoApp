name: frentis_cao
description: "Aplicativo FrentisCão - Proteção Animal"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  supabase_flutter: ^2.12.4
  flutter_dotenv: ^6.0.1
  mask_text_input_formatter: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/background/
    - assets/pics/Cadastro/animal-shelter/
    - assets/pics/Cadastro/cat-and-dog/
    - assets/pics/Login/adopt-a-pet/
    - .env
